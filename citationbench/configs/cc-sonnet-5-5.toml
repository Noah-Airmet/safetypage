# Claude Code with claude-sonnet-5-5, on the held-out split of snapshot 2026.11.3.
agent = "claude-code"
model = "claude-sonnet-5-5"
questions = "citationbench/heldout/test.jsonl"
limit = 150
corpus = "data/snapshots/2026.11.3"
server = "http://localhost:8766"
ops_db = "citationbench/work/ops.sqlite"
surface = "default"
epochs = 1
batch = 150
pause = 10
max_used = { five_hour = 0.55, seven_day = 0.45 }  # 0.6 for everything on the account, less room for other use
