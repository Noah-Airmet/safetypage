# Claude Code with claude-opus-5-5, on the held-out split of snapshot 2026.11.3.
agent = "claude-code"
model = "claude-opus-5-5"
questions = "citationbench/heldout/test.jsonl"
limit = 50
corpus = "data/snapshots/2026.11.3"
server = "http://localhost:8766"
ops_db = "citationbench/work/ops.sqlite"
surface = "default"
epochs = 1
batch = 50
pause = 10
max_used = 1.0  # no ceiling: the run stops only when the CLI reports a real usage limit
