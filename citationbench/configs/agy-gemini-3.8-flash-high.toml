# Antigravity CLI (Noah's Google login) with Gemini 3.8 Flash (High). Its web search cannot be
# turned off; a sample that uses it, or any tool but the library's, is marked contaminated.
agent = "antigravity"
model = "gemini-3.8-flash-high"
judge = "claude-code:claude-sonnet-5-5"
questions = "citationbench/questions/dev.jsonl"
corpus = "fixtures"
server = "http://localhost:8766"
