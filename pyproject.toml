[project]
name = "onthepage"
version = "0.1.0"
description = "A page-cited library of the AI safety record: the core library (IDs, citations, quote verification, licence tiers, storage)."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.14.3",
    "rapidfuzz>=3.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onthepage"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "PL", "N", "S", "TID", "ARG", "PTH", "RET"]
ignore = [
    "PLR2004", # magic values are fine in tests and small tables
    "PLR0913", # keyword-heavy constructors are deliberate
    "PLR0911", # branch-count limits: judged in review, not by a counter
    "PLR0912",
    "PLR0915",
    "RUF001",  # this code is about confusable Unicode
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608", "PLR0915", "ARG001"]
"fixtures/**" = ["ARG002"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true

[tool.coverage.run]
source = ["onthepage"]
branch = true

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
fixtures = [
    "pymupdf>=2.1",
]
